<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirdique Storage & Auth Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto space-y-8">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-indigo-400">Sirdique Storage</h1>
            <p class="text-sm text-slate-400">Cikakken Backend & Storage Management System</p>
        </div>

        <!-- Create Project Section -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
            <h2 class="text-xl font-semibold">1. Kirkiri Sabon Project</h2>
            <input type="text" id="projectName" placeholder="Sunan Project (misali: MyBlog)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl focus:outline-none focus:border-indigo-500">
            <button onclick="createProject()" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded-xl font-medium transition">Kirkira Project</button>
            <div id="projectResult" class="hidden bg-slate-950 p-4 rounded-xl border border-indigo-900 text-xs space-y-2"></div>
        </div>
    </div>

    <script>
        async function createProject() {
            const name = document.getElementById('projectName').value;
            if(!name) return alert('Sanya sunan project!');
            
            const res = await fetch('/api/projects/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            if(data.success) {
                const box = document.getElementById('projectResult');
                box.classList.remove('hidden');
                box.innerHTML = `<p class='text-green-400 font-bold'>An kirkira da nasara!</p>
                                 <p><b>Project ID:</b> ${data.project_id}</p>
                                 <p><b>API Key:</b> ${data.api_key}</p>`;
            }
        }
    </script>
</body>
</html>
