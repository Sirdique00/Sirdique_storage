<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirdique Storage Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-6">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-indigo-400">Sirdique Storage</h1>
            <p class="text-xs text-slate-400">Cikakken Backend & Storage System</p>
        </div>

        <!-- AUTH SECTION -->
        <div id="authSection" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
            <h2 class="text-lg font-semibold" id="authTitle">Shiga ko Yi Register</h2>
            <input type="email" id="email" placeholder="Email Address" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
            <input type="password" id="password" placeholder="Password" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
            <div id="otpBox" class="hidden space-y-2">
                <input type="text" id="otpCode" placeholder="Sanya OTP Code (Expires in 1 min)" class="w-full bg-slate-950 border border-indigo-600 p-3 rounded-xl text-center tracking-widest font-bold">
                <button onclick="verifyOtp()" class="w-full bg-green-600 p-3 rounded-xl font-medium">Tabbatar da OTP</button>
            </div>
            <div id="authButtons" class="space-y-2">
                <button onclick="registerUser()" class="w-full bg-indigo-600 p-3 rounded-xl font-medium">Yi Register</button>
                <button onclick="loginUser()" class="w-full bg-slate-800 p-3 rounded-xl font-medium">Login / Shiga Admin (Pin 676767)</button>
            </div>
        </div>

        <!-- DASHBOARD SECTION (Hidden by default) -->
        <div id="dashboardSection" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
                <span id="userDisplay" class="text-xs text-indigo-400 font-bold"></span>
                <button onclick="logout()" class="text-xs bg-red-600 px-3 py-1.5 rounded-lg">Fita</button>
            </div>

            <!-- Create Project -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h2 class="text-lg font-semibold">Kirkiri Sabon Project (Max 2)</h2>
                <input type="text" id="newProjectName" placeholder="Sunan Project (Unique)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                <button onclick="createProject()" class="w-full bg-indigo-600 p-3 rounded-xl font-medium">Kirkira Project</button>
            </div>

            <!-- Project List -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h2 class="text-lg font-semibold">Jerin Project ɗinka</h2>
                <div id="projectList" class="space-y-3"></div>
            </div>
        </div>

        <!-- ADMIN PANEL (Hidden) -->
        <div id="adminSection" class="hidden bg-slate-900 p-6 rounded-2xl border border-indigo-500 space-y-4">
            <h2 class="text-xl font-bold text-indigo-400">Admin Dashboard</h2>
            <p class="text-xs text-slate-400">Admin Email: abubakarsadeeq8533@gmail.com</p>
            <div id="serverStats" class="bg-slate-950 p-4 rounded-xl text-xs space-y-2"></div>
            <button onclick="location.reload()" class="w-full bg-slate-800 p-2 rounded-lg text-xs">Komawa Baya</button>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('sirdique_user') || null;
        if(currentUser) showDashboard();

        async function registerUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password})});
            const data = await res.json();
            if(data.success) {
                alert(data.message);
                document.getElementById('otpBox').classList.remove('hidden');
                document.getElementById('authButtons').classList.add('hidden');
            } else alert(data.error);
        }

        async function verifyOtp() {
            const email = document.getElementById('email').value;
            const code = document.getElementById('otpCode').value;
            const res = await fetch('/api/auth/verify', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, code})});
            const data = await res.json();
            if(data.success) {
                alert('An tabbatar da account ɗinka! Yanzu zaka iya yin login.');
                location.reload();
            } else alert(data.error);
        }

        async function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(password === '676767' || email === 'abubakarsadeeq8533@gmail.com') {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                loadAdminStats();
                return;
            }

            const res = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password})});
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('sirdique_user', data.email);
                currentUser = data.email;
                showDashboard();
            } else alert(data.error);
        }

        function showDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = `User: ${currentUser}`;
            loadProjects();
        }

        async function createProject() {
            const name = document.getElementById('newProjectName').value;
            const res = await fetch('/api/projects/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email: currentUser, name})});
            const data = await res.json();
            if(data.success) {
                alert('An kirkira project da nasara!');
                loadProjects();
            } else alert(data.error);
        }

        async function loadProjects() {
            const res = await fetch(`/api/projects/list/${currentUser}`);
            const data = await res.json();
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            data.projects.forEach(p => {
                list.innerHTML += `<div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs space-y-1">
                    <p class="font-bold text-indigo-400">${p.name}</p>
                    <p><b>Project ID:</b> ${p.project_id}</p>
                    <p><b>API Key:</b> ${p.api_key}</p>
                    <p><b>Storage Limit:</b> 800MB (Used: ${(p.storage_used/(1024*1024)).toFixed(2)} MB)</p>
                    <p class="text-[10px] text-slate-500">Endpoint URL: https://sirdique-storage.onrender.com/api/save</p>
                </div>`;
            });
        }

        async function loadAdminStats() {
            const res = await fetch('/api/system/storage-info');
            const data = await res.json();
            document.getElementById('serverStats').innerHTML = `
                <p><b>Admin Email:</b> abubakarsadeeq8533@gmail.com</p>
                <p><b>Total Storage Used:</b> ${data.total_storage_used_mb.toFixed(2)} MB</p>
                <p><b>Server Capacity:</b> ${data.server_total_capacity_gb} GB</p>
            `;
        }

        function logout() {
            localStorage.removeItem('sirdique_user');
            location.reload();
        }
    </script>
</body>
</html>
